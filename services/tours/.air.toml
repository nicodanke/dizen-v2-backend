# Air configuration for hot reload in development (RF-16).
root = "."
tmp_dir = "/tmp/air"

[build]
  # The build runs from the repository root so the go.work resolves the pkg module.
  cmd = "cd /src && go build -o /tmp/air/server ./services/tours/cmd/server"
  bin = "/tmp/air/server"
  full_bin = "/tmp/air/server"

  # Watching pkg/ too is what makes a change to the shared library reload every service,
  # which is the point of having it be one module.
  include_dir = ["cmd", "internal"]
  include_ext = ["go", "sql", "yaml"]
  exclude_dir = ["tmp", "vendor", "testdata"]
  exclude_regex = ["_test\\.go"]

  delay = 500
  stop_on_error = true
  send_interrupt = true
  kill_delay = 2000

[log]
  time = true

[misc]
  clean_on_exit = true
