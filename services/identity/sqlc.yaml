version: "2"

# Hard rule 1: sqlc, never an ORM. Explicit SQL in internal/db/queries, generated types.
# golang-migrate owns the schema; sqlc only reads it.
sql:
  - engine: "postgresql"
    # sqlc reads the migrations to learn the schema. It understands the golang-migrate
    # naming convention and ignores the .down.sql files.
    schema: "internal/db/migrations"
    queries: "internal/db/queries"

    gen:
      go:
        package: "sqlc"
        out: "internal/db/sqlc"
        sql_package: "pgx/v5"

        # The generated Querier interface is what the repositories wrap and what mockery
        # generates the test doubles from (RF-9, RF-18).
        emit_interface: true

        # A nullable column becomes a pointer, so "absent" and "zero" stop being the same
        # value -- the distinction that matters for every optional timestamp.
        emit_pointers_for_null_types: true

        emit_json_tags: true
        emit_empty_slices: true
        emit_exact_table_names: false

        overrides:
          # uuid v7 everywhere (02, conventions).
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true

          # timestamptz as time.Time rather than pgtype, so the domain types carry no
          # driver types.
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true

          # jsonb as raw JSON: the payload is opaque to the database layer and is decoded
          # by whoever owns its shape.
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
          - db_type: "jsonb"
            nullable: true
            go_type: "encoding/json.RawMessage"
