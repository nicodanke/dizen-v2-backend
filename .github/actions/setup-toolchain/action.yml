# Composite action shared by every job that needs to build or generate anything.
#
# It exists so the toolchain is described once. The pinned tools are the same ones a
# developer gets from `make tools`, installed from the same tools/versions.mk, because a CI
# that installs different versions than the team runs locally reports failures nobody can
# reproduce.
name: Set up the toolchain
description: Go, the module cache and the tools pinned in tools/versions.mk

inputs:
  dart:
    description: >-
      Link protoc-gen-dart as well, which only `make proto` needs. The Dart SDK itself has
      to already be on PATH: it is installed by the calling job, not here. See the note on
      the step below.
    required: false
    default: 'false'

runs:
  using: composite

  steps:
    - name: Go
      id: go
      uses: actions/setup-go@v5
      with:
        # go.work is the single source of the version, the same file the workspace builds
        # from. Naming a version here would let the two drift.
        go-version-file: go.work
        cache-dependency-path: |
          go.sum
          pkg/go.sum
          services/*/go.sum

    # ./bin holds ten binaries that take about three minutes to build from source. They only
    # change when tools/versions.mk or the Go version does, which is exactly the cache key.
    - name: Restore the pinned tools
      id: tools
      uses: actions/cache@v4
      with:
        path: bin
        key: tools-${{ runner.os }}-go${{ steps.go.outputs.go-version }}-${{ hashFiles('tools/versions.mk') }}

    - name: Install the pinned tools
      if: steps.tools.outputs.cache-hit != 'true'
      shell: bash
      run: make tools

    # The Dart SDK is deliberately NOT installed here. dart-lang/setup-dart registers a
    # problem matcher with a path relative to the action currently running, and from inside
    # a composite action that resolves to *this* directory rather than its own, so it fails
    # with "Could not find file .../setup-toolchain/dart-analyzer.json". The SDK installs
    # fine, but every run is annotated with an error.
    #
    # So the calling job runs `dart-lang/setup-dart@v1` itself, before this action, and this
    # one only links the plugin. See the `contract` job in ci.yml.
    #
    # This step runs on a cache hit as well: protoc-gen-dart lives in the pub cache and ./bin
    # only holds a symlink to it, so restoring ./bin restores a link pointing at nothing.
    - name: protoc-gen-dart
      if: inputs.dart == 'true'
      shell: bash
      run: |
        if ! command -v dart >/dev/null 2>&1; then
          echo "::error::The Dart SDK is not on PATH. The calling job has to run dart-lang/setup-dart@v1 before this action."
          exit 1
        fi
        make tools-dart
