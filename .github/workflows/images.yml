# Builds the service images and publishes them to GHCR (PRD-18 RF-4, D-35).
#
# The server does not compile. This is not a preference: building five Go services on the
# four-core VPS that also runs the v1 stack took the machine down three times, twice with
# production affected, and the last attempt exhausted 8 GB of RAM and rebooted the box.
# PRD-18 names building elsewhere as the mitigation for that exact risk in its own table.
#
# Three things follow beyond speed:
#
#   - the VPS never competes with production for CPU or memory;
#   - staging and production run the same artifact, promoted by tag, rather than two
#     compilations of one commit at two different moments;
#   - a restart stops meaning a rebuild. Bringing a service back becomes pulling an image
#     that already exists, which is seconds instead of the twelve minutes the v1 stack takes.
#
# Only linux/amd64 is built: that is what the VPS runs. A developer machine builds its own
# images from deploy/docker-compose.yml, which is a different file and a different stage.
name: images

on:
  push:
    branches: [main, staging]
    tags: ['v*']

# One publication at a time per ref. Two runs pushing the same tag is a race whose winner is
# whichever finishes last, which is not a property to leave to chance.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      # One service failing should not hide whether the others build.
      fail-fast: false
      matrix:
        service: [identity, tours, booking, admin, mail-dispatcher]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The workflow token is enough: `packages: write` above scopes it to this
          # repository's packages and nothing else (RF-11b).
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          # What each ref produces:
          #   push to staging   -> :staging and :sha-<short>
          #   push to main      -> :main    and :sha-<short>
          #   tag v1.2.3        -> :v1.2.3, :1.2, :1
          # The moving tag is what Dokploy points at; the sha tag is what makes a rollback a
          # matter of naming an image rather than rebuilding an old commit.
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The three values the binary reports on /livez. Filling them here is what ends the
          # "version=dev, commit=unknown" a server-side build left behind, and it is what
          # makes an error traceable to a commit. Dokploy cannot supply them: its own issue
          # #2715 is the open request for exactly that.
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          # The Dockerfiles already mount the module and compiler caches; this is what
          # carries those mounts between runs.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # A single check to make required in branch protection, rather than five whose names change
  # whenever the matrix does.
  published:
    name: images published
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Every image built
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::at least one image failed to build; a deployment would run an old one"
            exit 1
          fi
          echo "all five images are published"

  # Deployment is triggered from here, by a tag this workflow pushes once the images exist.
  #
  # The ordering is the whole point, and it defeats every other trigger: a Dokploy branch
  # watcher, or the `v*` tag a human pushes to cut a release, both react to a git event that
  # happens BEFORE the images for that commit are published. The deployment would pull
  # `manifest unknown` every time. Only something running after the build knows they are
  # there, so this job is gated on `published`.
  #
  # The tag says exactly that: this ref has images and is deployable.
  #
  #   push to staging   ->  deployed-staging-<sha>   Dokploy pattern: deployed-staging-*
  #   tag v1.2.3        ->  deployed-v1.2.3          Dokploy pattern: deployed-v*
  #
  # The two patterns do not overlap, so one environment cannot pick up the other's tag. And
  # because the trigger is a ref rather than a URL, there is no unauthenticated webhook and
  # no secret to keep: the deployment leaves a trace in the history that says which commit
  # went out and when.
  #
  # Dokploy's own branch auto-deploy must be OFF on both projects. That is the trigger that
  # races the build.
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: published
    if: github.ref == 'refs/heads/staging' || github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag the commit as deployable
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="deployed-${GITHUB_REF_NAME}"
            environment=production
          else
            tag="deployed-staging-${GITHUB_SHA:0:7}"
            environment=staging
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Forced, so re-running this workflow on the same commit moves the ref and triggers
          # a fresh deployment instead of failing on a tag that already exists. Re-deploying
          # the same version is a thing people legitimately want to do.
          git tag -f "$tag" "$GITHUB_SHA"
          git push -f origin "refs/tags/${tag}"

          echo "==> ${tag} pushed; Dokploy deploys ${environment} from it"
          echo "    the five images this run published are already in GHCR"
