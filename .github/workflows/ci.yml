# The quality pipeline of dizen-v2-backend (PRD-18 RF-11, PRD-25 RF-7).
#
# One pipeline per repository, with no path filters and no change detection: if this
# repository changed, the whole pipeline runs. That is the concrete advantage of having
# three separate repositories, and the reason a push to dizen-v2-mobile costs nothing here.
#
# The jobs are independent on purpose. They run in parallel, and a failure in one still
# reports the others, so a pull request gets the whole list of what is wrong in one round
# instead of one problem per push.
name: ci

on:
  pull_request:
  push:
    branches: [main, staging]
    # Release tags too: publishing the images of a version nobody tested is exactly what the
    # gate below exists to prevent.
    tags: ['v*']

# A second push to the same branch makes the first run pointless. On main and staging it is
# not cancelled: those runs are what the deployment and the contract publication key off.
#
# The consequence is worth knowing before it confuses somebody: a superseded run ends with
# "Error: The operation was canceled." wherever it happened to be, which reads exactly like a
# failure. A run that stops mid-step with that message, and has a newer run behind it, was
# cancelled here and did not fail.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/staging' }}

permissions:
  contents: read

jobs:
  lint:
    name: static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-toolchain

      - name: Formatting
        run: make fmt-check

      - name: go vet
        run: make vet

      - name: golangci-lint
        run: make lint

      # A direct dependency left marked `// indirect` breaks nothing and is therefore never
      # noticed: the build works and the tests pass while the manifest lies about what the
      # module imports.
      - name: Modules are tidy
        run: make tidy-check

      # `go fix` only has something to say when the Go version moves, so it is here and not
      # in the pre-commit hook (PRD-25 RF-3): running it on every push would be time given
      # away. Applying it and checking the tree is more reliable than reading an exit code.
      - name: Modernizations applied
        run: |
          make fix
          if ! git diff --quiet; then
            echo "::error::'make fix' changed files. Run it locally and commit the result."
            git --no-pager diff
            exit 1
          fi

      # The Yaak collection is part of the contract surface: an endpoint is not finished
      # until it has its request, and no credential is ever committed (03 section 8.2).
      - name: API collection
        run: make api-client

      # The production compose parses, and every variable it reads is documented in
      # deploy/dokploy.env.example. Compose only warns about a missing one and carries on
      # with an empty string, which on a server means an empty database password.
      - name: Deployment compose
        run: make deploy-check

  commits:
    name: commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only on pull requests. What reaches main is either the squashed title or the commits of
    # the branch, depending on the merge button, so both are checked here -- before the merge,
    # which is the only moment either can still be rewritten.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # The range is base..head, so both ends have to exist locally.
          fetch-depth: 0

      - uses: ./.github/actions/setup-toolchain

      - name: Commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: make commit-check RANGE="${BASE}..${HEAD}"

      # The title arrives through the environment and never through ${{ }} inside the script.
      # A pull request title is text a stranger can write, and interpolating it into a shell
      # command is how a title becomes a command on the runner.
      - name: Pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | go run ./tools/commitcheck --stdin

  contract:
    name: contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # buf breaking compares against main, and the generated Dart package is diffed
          # against what is committed: both need the real history, not a shallow clone.
          fetch-depth: 0

      # At the job level and not inside the composite action: setup-dart resolves its
      # problem matcher against the action that is running, and from inside a composite it
      # looks for the file in the wrong directory and annotates every run with an error.
      - uses: dart-lang/setup-dart@v1

      - uses: ./.github/actions/setup-toolchain
        with:
          dart: 'true'

      - name: buf lint
        run: make proto-lint

      - name: buf format
        working-directory: proto
        run: ../bin/buf format --diff --exit-code

      # Hard rule 4: proto changes are always additive. On main this compares main against
      # itself and finds nothing, which is the correct answer there.
      - name: buf breaking against main
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            # actions/checkout leaves main as a remote-tracking ref; buf resolves
            # `branch=main` against the local ones.
            git fetch --no-tags origin +refs/heads/main:refs/heads/main
          fi
          make proto-breaking

      # Hard rule 3: the generated code is committed, so it has to match the protos.
      - name: Generated code is up to date
        run: make proto-check

  sqlc:
    name: generated queries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-toolchain

      - name: sqlc output is up to date
        run: make sqlc-check

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The history pass needs every commit: a secret added and then deleted in the same
          # branch leaves a clean tree and a leaked repository (acceptance criterion 8).
          fetch-depth: 0

      - uses: ./.github/actions/setup-toolchain

      - name: gitleaks
        run: make secrets-scan

  test:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-toolchain

      # Fast feedback: the integration tests are behind a build tag, so this job needs no
      # Docker and finishes long before the coverage one.
      - name: go test -race
        run: make test

  coverage:
    name: coverage gate
    runs-on: ubuntu-latest
    # Testcontainers pulls Postgres, PostGIS, Redis and RabbitMQ on a cold runner and then
    # starts eighteen containers, which on two cores is minutes and not seconds. The budget
    # is a safety net for a hung run, not an estimate of a healthy one.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-toolchain

      # The same bytes either way, but pulled four at a time and in a step of their own: a
      # slow registry then reads as a slow pull instead of as a slow test suite. The list
      # comes from pkg/testutils, so it cannot drift from what the tests actually start.
      - name: Pre-pull the test images
        run: |
          set -o pipefail
          make test-images | xargs -P 4 -n 1 docker pull -q

      # Unit and integration tests in a single measurement. Splitting them would mean two
      # partial profiles and a threshold evaluated against neither (PRD-25 RF-10).
      #
      # The modules run in parallel inside the script, because the cost is container startup
      # and not test logic: eighteen Postgres containers, and six waits that overlap instead
      # of adding up.
      - name: Tests and the 70% gate
        # Two at a time. The evidence so far says the total is dominated by how long a
        # container takes to become ready on this runner rather than by contention, so this
        # is a starting point to tune with the per-module timings the script now prints, not
        # a tuned value.
        env:
          COVERAGE_JOBS: "2"
        run: make test-coverage

      - name: Browsable report
        if: always()
        run: |
          if [ -f coverage.filtered.out ]; then
            go tool cover -html=coverage.filtered.out -o coverage.html
          fi

      # Uploaded even when the gate fails: that is precisely when somebody needs to see
      # which lines are uncovered. The comment on the pull request and the README badge
      # arrive with PRD-25 RF-9, once D-17 settles which tool publishes them.
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.html
            coverage.filtered.out
          retention-days: 14
          if-no-files-found: warn

  # =========================================================================
  # From here on the pipeline stops verifying and starts publishing.
  #
  # Every job below waits for ALL the checks above. That is the difference between "the
  # images were built" and "the images were built from a commit that passed", and it is what
  # acceptance criterion 1 of PRD-18 actually asks for: a push to `staging`, *once CI passes*,
  # updates staging. While these lived in a separate workflow they ran in parallel with the
  # tests and could publish and deploy a red commit.
  # =========================================================================

  images:
    # The matrix value is in the name, or the five runs are indistinguishable in the UI.
    name: image (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Everything that verifies, except `commits`: that one only runs on pull requests, and a
    # skipped dependency skips its dependents, which would mean nothing ever publishes on a
    # push. The commit messages were already checked on the pull request that produced this
    # commit.
    needs: [lint, contract, sqlc, secrets, test, coverage]
    # Pull requests verify; they do not publish.
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    strategy:
      # One service failing should not hide whether the others build.
      fail-fast: false
      matrix:
        service: [identity, tours, booking, admin, mail-dispatcher]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # A release carries its tag; a branch carries the commit, because `staging` alone does
      # not distinguish one deployment from the next -- and telling them apart is the whole
      # point of reporting a version on /livez.
      - name: Version string
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The workflow token is enough: `packages: write` above scopes it to this
          # repository's packages and nothing else (RF-11b).
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          # What each ref produces:
          #   push to staging   -> :staging and :sha-<short>
          #   push to main      -> :main    and :sha-<short>
          #   tag v1.2.3        -> :v1.2.3, :1.2, :1
          # The moving tag is what Dokploy points at; the sha tag is what makes a rollback a
          # matter of naming an image rather than rebuilding an old commit.
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The three values the binary reports on /livez. Filling them here is what ends the
          # "version=dev, commit=unknown" a server-side build left behind, and it is what
          # makes an error traceable to a commit. Dokploy cannot supply them: its own issue
          # #2715 is the open request for exactly that.
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          # The Dockerfiles already mount the module and compiler caches; this is what
          # carries those mounts between runs.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # Deployment is triggered by a tag this workflow pushes once the images exist AND the
  # pipeline is green.
  #
  # The ordering defeats every other trigger: a Dokploy branch watcher, or the `v*` tag a
  # person pushes to cut a release, both react to a git event that happens BEFORE the images
  # for that commit are published. The deployment would pull `manifest unknown` every time.
  #
  #   push to staging   ->  deployed-staging-<sha>   Dokploy pattern: deployed-staging-*
  #   tag v1.2.3        ->  deployed-v1.2.3          Dokploy pattern: deployed-v*
  #
  # The two patterns do not overlap, so one environment cannot pick up the other's tag. And
  # because the trigger is a ref rather than a URL, there is no unauthenticated webhook and no
  # secret to keep: the deployment leaves a trace saying which commit went out and when.
  #
  # Dokploy's own branch auto-deploy must be OFF on every project.
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: images
    if: github.ref == 'refs/heads/staging' || github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag the commit as deployable
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="deployed-${GITHUB_REF_NAME}"
            environment=production
          else
            tag="deployed-staging-${GITHUB_SHA:0:7}"
            environment=staging
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Forced, so re-running the pipeline on the same commit moves the ref and triggers a
          # fresh deployment instead of failing on a tag that already exists. Redeploying the
          # same version is something people legitimately want to do.
          git tag -f "$tag" "$GITHUB_SHA"
          git push -f origin "refs/tags/${tag}"

          echo "==> ${tag} pushed; Dokploy deploys ${environment} from it"
