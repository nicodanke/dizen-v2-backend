# RabbitMQ configuration (PRD-18 RF-3).
#
# These two settings used to be the RABBITMQ_VM_MEMORY_HIGH_WATERMARK and
# RABBITMQ_DISK_FREE_LIMIT environment variables. The image no longer accepts them: it
# refuses to start and prints "deprecated environment variables detected", so they live here.

# The single most important setting in this stack.
#
# The default watermark is 40% of the memory RabbitMQ can see, and inside a container it sees
# the memory of the HOST -- which here also runs the v1 stack. On an 8 GB VPS it would grow
# towards 3 GB, blow past the 512 MB container limit and be OOM-killed by the kernel, with
# nothing in its own log to explain it, because from its point of view it was nowhere near
# the limit.
#
# An absolute value below the container limit makes it block publishers and report memory
# pressure instead: a bad day rather than a lost broker. Roughly 75% of the limit.
vm_memory_high_watermark.absolute = 384MiB

# Same idea for disk. The default is 50 MB, small enough that the broker only notices a full
# disk once it already is one.
disk_free_limit.absolute = 2GB
