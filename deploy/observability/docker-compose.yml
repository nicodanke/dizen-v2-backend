# The observability stack (PRD-18 RF-14), as its own Dokploy project.
#
# One stack for both environments, not one each. RF-14 says "in the production compose", and
# this deviates on purpose: the VPS also runs the v1 stack, and a second Prometheus, Grafana
# and Jaeger would cost real memory to answer the same questions about a different label.
# Staging and production stay apart where it matters -- their data, their secrets, their
# containers -- and share only the thing looking at them (D-46).
#
# Loki is deliberately absent (D-46). Dokploy already shows each container's logs, and the
# pair of Loki and Promtail is the heaviest part of RF-14 for the least return at this size.
#
# Deployed as its own project so it survives a redeploy of either environment, and so its
# retention is not tied to an application release.

name: dizen-v2-observability

networks:
  dokploy-network:
    external: true

volumes:
  prometheus-data:
  grafana-data:
  jaeger-data:

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # Prometheus discovers its targets from Docker, and this is what it asks.
  #
  # Not the socket itself. Read access to /var/run/docker.sock is effectively root on the
  # host -- it can start a privileged container -- and Prometheus needs one thing from it:
  # the list of containers. This proxy exposes exactly that and refuses everything else, so
  # a compromised Prometheus gets a container listing rather than the machine.
  #
  # It is also what makes it work at all: the prom/prometheus image runs as nobody, the
  # socket is root-owned with mode 660, and mounting it directly fails with a permission
  # error that Prometheus logs once and then reports as zero targets.
  # ---------------------------------------------------------------------------
  docker-proxy:
    <<: *logging
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0
    container_name: dizen-v2-docker-proxy
    restart: unless-stopped
    networks: [dokploy-network]

    environment:
      # Both are read-only listings, and both are needed: Prometheus lists the containers,
      # then reads the networks to work out which address to scrape each one on. Without
      # NETWORKS it gets a 403 there and discovers nothing -- the containers call having
      # succeeded, which makes it look like a filtering problem rather than a permission.
      #
      # Everything else stays at its default of 0, which is deny.
      CONTAINERS: "1"
      NETWORKS: "1"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    expose: ["2375"]

    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

  # ---------------------------------------------------------------------------
  # Metrics. Retention is 15 days, as RF-14 asks: the risk table of PRD-18 lists a full disk
  # from metrics, and this is what bounds it.
  # ---------------------------------------------------------------------------
  prometheus:
    <<: *logging
    image: prom/prometheus:v3.7.3
    container_name: dizen-v2-prometheus
    restart: unless-stopped
    networks: [dokploy-network]

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=4GB
      - --web.enable-lifecycle

    volumes:
      - ./prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    depends_on:
      - docker-proxy

    # Not published and not routed. Prometheus has no authentication of its own, so the only
    # way in is Grafana, which does. Reach it directly through an SSH tunnel if you must.
    expose: ["9090"]

    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 640M
        reservations:
          memory: 192M

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Traces. Badger on disk rather than in memory, so a restart does not lose the trace of
  # the incident that caused it. Seven days, as RF-14 asks.
  # ---------------------------------------------------------------------------
  # Docker creates a named volume owned by root, and Jaeger runs as uid 10001, so it cannot
  # create its own storage directories inside it -- `mkdir /badger/key: permission denied`,
  # in a restart loop. This prepares the volume once, so Jaeger itself stays unprivileged.
  # Running Jaeger as root would be the shorter fix and a worse one.
  jaeger-init:
    image: busybox:1.37
    command:
      - sh
      - -c
      - mkdir -p /badger/data /badger/key && chown -R 10001:0 /badger
    volumes:
      - jaeger-data:/badger

  jaeger:
    <<: *logging
    # v2, not the v1 all-in-one the development compose still uses. v1 reached end of life
    # on 2025-12-31: it receives no fixes and, more to the point here, no security patches.
    image: jaegertracing/jaeger:2.20.0
    container_name: dizen-v2-jaeger
    restart: unless-stopped
    networks: [dokploy-network]

    # v2 is an OpenTelemetry Collector distribution, so it is configured by a file instead
    # of the environment variables v1 took. Retention lives in there too.
    command: ["--config", "file:/etc/jaeger/config.yaml"]

    volumes:
      - ./jaeger/config.yaml:/etc/jaeger/config.yaml:ro
      - jaeger-data:/badger

    depends_on:
      jaeger-init:
        condition: service_completed_successfully

    # 4317 is OTLP gRPC, which is what the services export to, by container name over the
    # shared network. 16686 is the query API, reached through Grafana's Jaeger data source.
    # Neither is published: nothing here is routed through Traefik.
    expose: ["4317", "16686"]

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          memory: 128M

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:13133/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # The only thing published, and the only one with a login.
  # ---------------------------------------------------------------------------
  grafana:
    <<: *logging
    image: grafana/grafana:12.3.0
    container_name: dizen-v2-grafana
    restart: unless-stopped
    networks: [dokploy-network]

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-dizen}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required. This is the only door into the metrics of both environments; generate it with openssl rand -hex 32}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://${GRAFANA_HOST:?GRAFANA_HOST is required, for example grafana.v2.dizen.pro}
      # Anonymous access off is the default; stated because RF-14 asks for restricted
      # access and a default is not a decision.
      GF_AUTH_ANONYMOUS_ENABLED: "false"

    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # Mounted over the file above: the dashboards are shared with the local environment
      # and versioned once, only the addresses differ. See the file for why.
      - ./grafana/datasources.deployed.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - grafana-data:/var/lib/grafana

    depends_on:
      - prometheus
      - jaeger

    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.dizen-grafana.rule=Host(`${GRAFANA_HOST}`)
      - traefik.http.routers.dizen-grafana.entrypoints=websecure
      - traefik.http.routers.dizen-grafana.tls=true
      - traefik.http.routers.dizen-grafana.tls.certresolver=${CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.dizen-grafana.loadbalancer.server.port=3000

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
        reservations:
          memory: 128M

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
