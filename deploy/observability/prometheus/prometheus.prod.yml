# Scrape configuration for the deployed environments (PRD-18 RF-14).
#
# One Prometheus serves both staging and production. They are told apart by a label, not by
# running two copies: the VPS also carries the v1 stack, and a second Prometheus would cost
# real memory to answer the same questions.
#
# Targets are discovered from Docker rather than listed. A static list would have to name
# containers like `dizen-v2-production-identity-1`, which encodes a replica index nobody
# should have to keep in sync, and would silently stop covering a service somebody adds.
#
# Prometheus measures the system; Sentry captures errors and Statsig measures user behaviour
# (01 section 7). Nothing here duplicates those.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: [dizen-v2-alertmanager:9093]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: dizen-services
    metrics_path: /metrics

    docker_sd_configs:
      # The proxy, not the socket. See the compose file for why.
      - host: tcp://dizen-v2-docker-proxy:2375
        refresh_interval: 30s
        # One target per network, instead of only the container's first one.
        #
        # The services are on two networks, `internal` first and `dokploy-network` second.
        # With the default of true, Prometheus considers only `internal`, whose address it
        # cannot reach, and the filter below then drops it -- leaving no targets at all and
        # no error to explain why.
        match_first_network: false

    relabel_configs:
      # Only containers that ask to be scraped, by a label of ours.
      #
      # Not the compose project name, which was the first attempt and does not work here:
      # Dokploy names the project itself and appends a random suffix -- the real ones are
      # `dizen-backend-staging-hstndj` and `dizen-backend-prod-4h0j1u` -- and that suffix
      # changes if a project is recreated. The v1 stack shares this host too, so a loose
      # pattern would have scraped it as well. The failure was silent: a fully anchored
      # regex matching nothing yields zero targets and no error.
      - source_labels: [__meta_docker_container_label_dizen_metrics]
        regex: "true"
        action: keep

      # A container on two networks is discovered twice. Keeping only the shared one leaves
      # exactly one target per container, and it is the network Prometheus can reach.
      - source_labels: [__meta_docker_network_name]
        regex: dokploy-network
        action: keep

      # The operational port: /metrics, /livez and /readyz answer there and it is not
      # published to the internet.
      - source_labels: [__meta_docker_network_ip]
        target_label: __address__
        replacement: $1:8080

      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service

      # Also ours, for the same reason: `dizen-backend-prod-4h0j1u` is not an environment
      # name anyone wants to read on a dashboard.
      - source_labels: [__meta_docker_container_label_dizen_environment]
        target_label: environment

  # The broker, for the dead-letter depth RF-15 alerts on. Static targets rather than
  # discovery: these two container names are fixed by their compose files, unlike the
  # application ones.
  #
  # /metrics/per-object rather than /metrics: the default endpoint aggregates across queues,
  # and "the dead letter queue is filling" is a question about one queue.
  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: [dizen-v2-rabbitmq-staging:15692]
        labels:
          environment: staging
      - targets: [dizen-v2-rabbitmq-production:15692]
        labels:
          environment: production

  - job_name: node
    static_configs:
      - targets: [dizen-v2-node-exporter:9100]

  # Certificate expiry. The probe runs from the blackbox exporter, so the target travels as
  # a parameter and the address is rewritten to the prober -- the standard shape, and the
  # one that reads as backwards the first time.
  - job_name: certificates
    metrics_path: /probe
    params:
      module: [tls_connect]
    static_configs:
      - targets:
          - api.v2.dizen.pro:443
          - admin-api.v2.dizen.pro:443
          - grpc-identity.v2.dizen.pro:443
          - grpc-tours.v2.dizen.pro:443
          - grpc-booking.v2.dizen.pro:443
        labels:
          environment: production
      - targets:
          - api.staging.v2.dizen.pro:443
          - grpc-identity.staging.v2.dizen.pro:443
        labels:
          environment: staging
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: dizen-v2-blackbox:9115

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
