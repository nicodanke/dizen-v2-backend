# Alert rules (PRD-18 RF-15).
#
# Each rule names the environment it fired in, because one stack watches both (D-46) and
# "identity is down" means something different in each.
#
# `for:` is not decoration. Every one of these can be briefly true during a deployment --
# a container restarting, a queue draining, a scrape missed -- and an alert that fires on
# every deploy is one people mute.

groups:
  - name: availability
    interval: 30s
    rules:
      # RF-15: service down, and /readyz failing for more than two minutes.
      #
      # Both are this rule. A service that cannot answer /metrics cannot answer /readyz
      # either, and one that is up but not ready is restarted by its own healthcheck before
      # two minutes are out. Splitting them would mean scraping a second endpoint to learn
      # what this already says.
      # Present, but not answering. The container is running and Prometheus reaches it,
      # and it does not reply -- starting up, applying migrations, or wedged.
      - alert: ServiceNotAnswering
        expr: up{job="dizen-services"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.service }} · {{ $labels.environment }} — running, not answering (2m)'
      - alert: ServiceMissing
        expr: max_over_time(up{job="dizen-services"}[1h]) unless up{job="dizen-services"}
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.service }} · {{ $labels.environment }} — container is gone'
      - alert: BrokerDown
        expr: up{job="rabbitmq"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'rabbitmq · {{ $labels.environment }} — unreachable, events not delivering'
      - alert: HighErrorRate
        expr: >-
          sum by (environment, service) (
            rate(dizen_grpc_requests_total{code=~"Internal|Unknown|Unavailable|DataLoss"}[5m])
          )
          /
          sum by (environment, service) (rate(dizen_grpc_requests_total[5m]))
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.service }} · {{ $labels.environment }} — {{ $value | humanizePercentage }} of requests failing'
      - alert: HighLatency
        expr: >-
          histogram_quantile(
            0.99,
            sum by (environment, service, le) (rate(dizen_grpc_request_duration_seconds_bucket[5m]))
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.service }} · {{ $labels.environment }} — p99 {{ $value | humanizeDuration }}, over 2s'
      - alert: DeadLetterQueueFilling
        expr: rabbitmq_queue_messages{queue=~".+\\.dlq"} > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.queue }} · {{ $labels.environment }} — {{ $value }} dead-lettered'
      - alert: DiskFilling
        expr: >-
          100 - (
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} * 100
          ) > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'disk {{ $labels.mountpoint }} — {{ $value | humanize }}% full'
      - alert: DiskCritical
        expr: >-
          100 - (
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} * 100
          ) > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'disk {{ $labels.mountpoint }} — {{ $value | humanize }}% full, critical'
      - alert: CertificateExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 14
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.instance }} — certificate expires in {{ $value | humanize }}d'
      - alert: CertificateProbeFailing
        expr: probe_success{job="certificates"} == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.instance }} — TLS handshake failing'
