# Data sources for the deployed stack, mounted over the local ones.
#
# They differ in one thing: the address. Locally each service is reachable by its compose
# service name; on the VPS the shared `dokploy-network` carries the v1 stack too, so a name
# as generic as `prometheus` is not necessarily ours. The container names are.
apiVersion: 1

# `deleteDatasources` runs before the definitions below, and it is here because of what
# happens without it: these datasources existed before they had a fixed uid, Grafana had
# assigned each a random one, and adding a uid made provisioning fail with "data source not
# found" -- which stops Grafana from starting at all, on an installation that was working.
#
# Deleting by name first makes the change converge on an existing volume instead of
# deadlocking on it. It is idempotent: a fresh install deletes nothing.
deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Jaeger
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    # Fixed, because the versioned dashboards reference it. Without a uid Grafana assigns a
    # random one and every panel comes up with "datasource not found".
    uid: dizen-prometheus
    access: proxy
    url: http://dizen-v2-prometheus:9090
    isDefault: true
    editable: false

  - name: Jaeger
    type: jaeger
    uid: dizen-jaeger
    access: proxy
    url: http://dizen-v2-jaeger:16686
    editable: false
