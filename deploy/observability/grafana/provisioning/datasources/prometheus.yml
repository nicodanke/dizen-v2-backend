# Data sources are provisioned rather than clicked in, so a fresh environment comes up
# already wired.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    # Fixed, because the versioned dashboards reference it. Without a uid Grafana assigns a
    # random one and every panel comes up with "datasource not found".
    uid: dizen-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Jaeger
    type: jaeger
    uid: dizen-jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false
