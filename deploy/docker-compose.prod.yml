# Production and staging deployment (PRD-18 RF-3, RF-3b, RF-5, RF-6, RF-10).
#
# One file for both environments. RF-2 asks for two separate Dokploy projects -- their own
# databases, their own domains, their own variables, nothing shared -- and that is what this
# file expresses: everything that differs is a variable, and the variables live in Dokploy,
# backed by Doppler (RF-8, hard rule 6). `deploy/dokploy.env.example` is the inventory.
#
# What this file assumes about Dokploy:
#   - it runs Traefik and owns the certificates, on the external `dokploy-network`;
#   - it builds on the server from this repository, so `build.context` is the repository root;
#   - the data stores are NOT here: Postgres, Redis and RabbitMQ are managed outside this
#     compose and arrive as connection strings (D-32), the same way the v1 stack does it.
#
# Every name Traefik sees is prefixed with ${DIZEN_ENV}. The v1 stack shares this Traefik and
# this network, so a router named `identity-rest` would be one name away from a collision;
# `staging-identity-rest` is not.

name: dizen-v2-${DIZEN_ENV}

# ---------------------------------------------------------------------------
# Shared fragments
# ---------------------------------------------------------------------------

# Bounded logs. The risk table of PRD-18 lists a full disk from logs and metrics; this is the
# half that belongs to the containers.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-service-defaults: &service-defaults
  <<: *logging
  restart: unless-stopped
  # Long enough for the graceful shutdown of 15 s (SHUTDOWN_TIMEOUT) to finish draining
  # before Docker sends SIGKILL.
  stop_grace_period: 30s
  # Both networks, and each for one reason: `internal` carries v2-to-v2 gRPC and Valhalla,
  # `dokploy-network` is where Traefik reaches the routed services and where the managed
  # data stores live. A service that needs a database needs the second one.
  networks: [internal, dokploy-network]
  # RF-3: limits per container, so one service cannot starve the rest -- and this VPS also
  # runs the v1 stack, so the ceiling matters more than it would on an empty machine.
  deploy:
    resources:
      limits:
        cpus: "0.75"
        memory: 320M
      reservations:
        memory: 64M

x-service-env: &service-env
  ENVIRONMENT: ${DIZEN_ENV}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  HTTP_PORT: "8080"
  GRPC_PORT: "9090"
  # RF-7: each service applies its own migrations at startup, under the advisory lock
  # golang-migrate takes. A failed migration fails the start, the container never becomes
  # ready, and the deployment stops without touching the running version.
  DATABASE_RUN_MIGRATIONS: "true"
  # Managed outside this compose (D-32). One credential per service, so a leaked one exposes
  # a single domain (hard rule 2).
  REDIS_URL: ${REDIS_URL}
  AMQP_URL: ${AMQP_URL}
  AMQP_EXCHANGE: ${AMQP_EXCHANGE:-dizen.events}
  # Empty until RF-14 deploys the collector; an empty endpoint disables exporting rather
  # than retrying against nothing.
  OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}
  TRACE_SAMPLE_RATIO: ${TRACE_SAMPLE_RATIO:-0.1}
  MIN_CLIENT_API_VERSION: ${MIN_CLIENT_API_VERSION:-}
  JWT_ISSUER: ${JWT_ISSUER:-dizen}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-dizen-app}
  JWT_PUBLIC_KEYS_PEM: ${JWT_PUBLIC_KEYS_PEM}

x-build-args: &build-args
  VERSION: ${VERSION:-dev}
  COMMIT: ${COMMIT:-unknown}
  BUILD_DATE: ${BUILD_DATE:-unknown}

# Traefik labels shared by every routed service would be nice to factor out, but a YAML
# anchor cannot interpolate the service name into a label key. They are written per service.

networks:
  # Private to this project, and the project name carries ${DIZEN_ENV}, so staging and
  # production get one each. This is what keeps v2 service-to-service traffic off the shared
  # network the v1 stack lives on.
  internal:
    driver: bridge

  # Created by Dokploy. Traefik reaches the routed services here, and the managed Postgres,
  # Redis and RabbitMQ are here too.
  dokploy-network:
    external: true

volumes:
  valhalla-tiles:

services:
  # =========================================================================
  # Services
  #
  # Routing (RF-5, RF-6):
  #
  #   REST   ${API_HOST}/v1/<service>/...      -> port 8080, plain HTTP
  #   gRPC   ${GRPC_HOST}  /dizen.<svc>.v1...  -> port 9090, h2c end to end
  #
  # Both rules rest on one convention: the first segment after /v1/ and the proto package
  # both carry the service name (D-24). That keeps the routing a constant instead of a table
  # that grows with every RPC, and every new google.api.http annotation has to respect it.
  #
  # Only /v1/ is published. /livez, /readyz and /metrics answer on the same port and are
  # reachable only from inside.
  # =========================================================================
  identity:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: services/identity/Dockerfile
      target: production
      args: *build-args
    environment:
      <<: *service-env
      SERVICE_NAME: identity
      DATABASE_URL: ${IDENTITY_DATABASE_URL}
      REDIS_NAMESPACE: identity
      # identity is the only service that issues tokens, so it is the only one that holds a
      # private key (01 section 6).
      JWT_PRIVATE_KEY_PEM: ${JWT_PRIVATE_KEY_PEM}
    labels:
      - traefik.enable=true
      # The container is on two networks; without this Traefik may pick the internal one and
      # route to an address it cannot reach.
      - traefik.docker.network=dokploy-network

      - traefik.http.routers.${DIZEN_ENV}-v2-identity-rest.rule=Host(`${API_HOST}`) && PathPrefix(`/v1/identity/`)
      - traefik.http.routers.${DIZEN_ENV}-v2-identity-rest.entrypoints=websecure
      - traefik.http.routers.${DIZEN_ENV}-v2-identity-rest.tls=true
      - traefik.http.routers.${DIZEN_ENV}-v2-identity-rest.tls.certresolver=${CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.${DIZEN_ENV}-v2-identity-rest.middlewares=${DIZEN_ENV}-v2-secure-headers@docker${EXTRA_MIDDLEWARES:-}
      - traefik.http.routers.${DIZEN_ENV}-v2-identity-rest.service=${DIZEN_ENV}-v2-identity-rest
      - traefik.http.services.${DIZEN_ENV}-v2-identity-rest.loadbalancer.server.port=8080

      # RF-6: h2c on the internal leg. The gRPC server speaks HTTP/2 without TLS, Traefik
      # terminates TLS at the edge and forwards HTTP/2 in the clear over the private network.
      # Without `scheme=h2c` Traefik downgrades to HTTP/1.1 and every call fails with an
      # unreadable framing error. The v1 stack sets the same label for the same reason.
      - traefik.http.routers.${DIZEN_ENV}-v2-identity-grpc.rule=Host(`${GRPC_HOST}`) && PathRegexp(`^/dizen\.identity\.v1\.`)
      - traefik.http.routers.${DIZEN_ENV}-v2-identity-grpc.entrypoints=websecure
      - traefik.http.routers.${DIZEN_ENV}-v2-identity-grpc.tls=true
      - traefik.http.routers.${DIZEN_ENV}-v2-identity-grpc.tls.certresolver=${CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.${DIZEN_ENV}-v2-identity-grpc.service=${DIZEN_ENV}-v2-identity-grpc
      - traefik.http.services.${DIZEN_ENV}-v2-identity-grpc.loadbalancer.server.port=9090
      - traefik.http.services.${DIZEN_ENV}-v2-identity-grpc.loadbalancer.server.scheme=h2c

      # Declared once, on this container, and referenced by every router of the project.
      - traefik.http.middlewares.${DIZEN_ENV}-v2-secure-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.${DIZEN_ENV}-v2-secure-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.${DIZEN_ENV}-v2-secure-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.${DIZEN_ENV}-v2-secure-headers.headers.frameDeny=true
      - traefik.http.middlewares.${DIZEN_ENV}-v2-secure-headers.headers.referrerPolicy=strict-origin-when-cross-origin
      # RF-5: staging carries an extra basic authentication, attached through
      # EXTRA_MIDDLEWARES, which is empty in production. The users come from a variable
      # because a htpasswd line is a credential.
      - traefik.http.middlewares.${DIZEN_ENV}-v2-basicauth.basicauth.users=${BASIC_AUTH_USERS:-}

  tours:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: services/tours/Dockerfile
      target: production
      args: *build-args
    environment:
      <<: *service-env
      SERVICE_NAME: tours
      DATABASE_URL: ${TOURS_DATABASE_URL}
      REDIS_NAMESPACE: tours
      # Only tours talks to the router, and only during authoring (07 section 3.2). Empty in
      # production, where Valhalla does not run.
      VALHALLA_URL: ${VALHALLA_URL:-}
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network

      - traefik.http.routers.${DIZEN_ENV}-v2-tours-rest.rule=Host(`${API_HOST}`) && PathPrefix(`/v1/tours/`)
      - traefik.http.routers.${DIZEN_ENV}-v2-tours-rest.entrypoints=websecure
      - traefik.http.routers.${DIZEN_ENV}-v2-tours-rest.tls=true
      - traefik.http.routers.${DIZEN_ENV}-v2-tours-rest.tls.certresolver=${CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.${DIZEN_ENV}-v2-tours-rest.middlewares=${DIZEN_ENV}-v2-secure-headers@docker${EXTRA_MIDDLEWARES:-}
      - traefik.http.routers.${DIZEN_ENV}-v2-tours-rest.service=${DIZEN_ENV}-v2-tours-rest
      - traefik.http.services.${DIZEN_ENV}-v2-tours-rest.loadbalancer.server.port=8080

      - traefik.http.routers.${DIZEN_ENV}-v2-tours-grpc.rule=Host(`${GRPC_HOST}`) && PathRegexp(`^/dizen\.tours\.v1\.`)
      - traefik.http.routers.${DIZEN_ENV}-v2-tours-grpc.entrypoints=websecure
      - traefik.http.routers.${DIZEN_ENV}-v2-tours-grpc.tls=true
      - traefik.http.routers.${DIZEN_ENV}-v2-tours-grpc.tls.certresolver=${CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.${DIZEN_ENV}-v2-tours-grpc.service=${DIZEN_ENV}-v2-tours-grpc
      - traefik.http.services.${DIZEN_ENV}-v2-tours-grpc.loadbalancer.server.port=9090
      - traefik.http.services.${DIZEN_ENV}-v2-tours-grpc.loadbalancer.server.scheme=h2c

  booking:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: services/booking/Dockerfile
      target: production
      args: *build-args
    environment:
      <<: *service-env
      SERVICE_NAME: booking
      DATABASE_URL: ${BOOKING_DATABASE_URL}
      REDIS_NAMESPACE: booking
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network

      - traefik.http.routers.${DIZEN_ENV}-v2-booking-rest.rule=Host(`${API_HOST}`) && PathPrefix(`/v1/booking/`)
      - traefik.http.routers.${DIZEN_ENV}-v2-booking-rest.entrypoints=websecure
      - traefik.http.routers.${DIZEN_ENV}-v2-booking-rest.tls=true
      - traefik.http.routers.${DIZEN_ENV}-v2-booking-rest.tls.certresolver=${CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.${DIZEN_ENV}-v2-booking-rest.middlewares=${DIZEN_ENV}-v2-secure-headers@docker${EXTRA_MIDDLEWARES:-}
      - traefik.http.routers.${DIZEN_ENV}-v2-booking-rest.service=${DIZEN_ENV}-v2-booking-rest
      - traefik.http.services.${DIZEN_ENV}-v2-booking-rest.loadbalancer.server.port=8080

      - traefik.http.routers.${DIZEN_ENV}-v2-booking-grpc.rule=Host(`${GRPC_HOST}`) && PathRegexp(`^/dizen\.booking\.v1\.`)
      - traefik.http.routers.${DIZEN_ENV}-v2-booking-grpc.entrypoints=websecure
      - traefik.http.routers.${DIZEN_ENV}-v2-booking-grpc.tls=true
      - traefik.http.routers.${DIZEN_ENV}-v2-booking-grpc.tls.certresolver=${CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.${DIZEN_ENV}-v2-booking-grpc.service=${DIZEN_ENV}-v2-booking-grpc
      - traefik.http.services.${DIZEN_ENV}-v2-booking-grpc.loadbalancer.server.port=9090
      - traefik.http.services.${DIZEN_ENV}-v2-booking-grpc.loadbalancer.server.scheme=h2c

  admin:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: services/admin/Dockerfile
      target: production
      args: *build-args
    environment:
      <<: *service-env
      SERVICE_NAME: admin
      DATABASE_URL: ${ADMIN_DATABASE_URL}
      REDIS_NAMESPACE: admin
      # The BFF reaches the other three over the internal network, in plaintext gRPC: that
      # traffic never leaves the private bridge (01 section 4.2).
      IDENTITY_GRPC_ADDR: identity:9090
      TOURS_GRPC_ADDR: tours:9090
      BOOKING_GRPC_ADDR: booking:9090
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network

      # Its own host, and only the REST surface: the dashboard is a web client and does not
      # speak gRPC (ADR A-1).
      - traefik.http.routers.${DIZEN_ENV}-v2-admin-rest.rule=Host(`${ADMIN_API_HOST}`) && PathPrefix(`/v1/`)
      - traefik.http.routers.${DIZEN_ENV}-v2-admin-rest.entrypoints=websecure
      - traefik.http.routers.${DIZEN_ENV}-v2-admin-rest.tls=true
      - traefik.http.routers.${DIZEN_ENV}-v2-admin-rest.tls.certresolver=${CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.${DIZEN_ENV}-v2-admin-rest.middlewares=${DIZEN_ENV}-v2-secure-headers@docker${EXTRA_MIDDLEWARES:-}
      - traefik.http.routers.${DIZEN_ENV}-v2-admin-rest.service=${DIZEN_ENV}-v2-admin-rest
      - traefik.http.services.${DIZEN_ENV}-v2-admin-rest.loadbalancer.server.port=8080

  mail-dispatcher:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: services/mail-dispatcher/Dockerfile
      target: production
      args: *build-args
    # No Traefik labels: this service consumes events and has no public API (01 section 2).
    # It is still on dokploy-network, because that is where its database and the broker are.
    environment:
      <<: *service-env
      SERVICE_NAME: mail-dispatcher
      DATABASE_URL: ${MAIL_DATABASE_URL}
      REDIS_NAMESPACE: mail-dispatcher

  # =========================================================================
  # Backups (RF-9)
  #
  # The databases moved out of this compose but the backup did not: they still have to be
  # dumped somewhere off the server, with 7 daily, 4 weekly and 3 monthly kept. It needs
  # nothing but the DSNs and the bucket, which is why moving the databases changed nothing
  # here.
  #
  #   docker compose run --rm backup backup     one run now
  #   docker compose run --rm backup verify     what is stored
  #   make backup-drill                         the restore drill, against throwaway containers
  # =========================================================================
  backup:
    <<: *logging
    build:
      context: ./backup
    restart: unless-stopped
    networks: [internal, dokploy-network]
    environment:
      DIZEN_ENV: ${DIZEN_ENV}
      TZ: ${BACKUP_TZ:-UTC}

      BACKUP_DATABASES: identity tours booking admin mail
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 3 * * *}
      BACKUP_RETAIN_DAILY: ${BACKUP_RETAIN_DAILY:-7}
      BACKUP_RETAIN_WEEKLY: ${BACKUP_RETAIN_WEEKLY:-4}
      BACKUP_RETAIN_MONTHLY: ${BACKUP_RETAIN_MONTHLY:-3}

      # The same DSNs the services use. This container is the only one that holds all five,
      # and it is also the only one with no port and no route: it talks to the databases and
      # to the bucket, and to nothing else.
      DSN_IDENTITY: ${IDENTITY_DATABASE_URL}
      DSN_TOURS: ${TOURS_DATABASE_URL}
      DSN_BOOKING: ${BOOKING_DATABASE_URL}
      DSN_ADMIN: ${ADMIN_DATABASE_URL}
      DSN_MAIL: ${MAIL_DATABASE_URL}

      # rclone is configured entirely through the environment, so no config file on the
      # server holds a key. The remote is called `backup`, which is what the scripts address.
      BACKUP_BUCKET: ${BACKUP_BUCKET}
      RCLONE_CONFIG_BACKUP_TYPE: s3
      RCLONE_CONFIG_BACKUP_PROVIDER: ${BACKUP_S3_PROVIDER:-Cloudflare}
      RCLONE_CONFIG_BACKUP_ENDPOINT: ${BACKUP_S3_ENDPOINT}
      RCLONE_CONFIG_BACKUP_REGION: ${BACKUP_S3_REGION:-auto}
      RCLONE_CONFIG_BACKUP_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID}
      RCLONE_CONFIG_BACKUP_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY}
      # R2 does not allow the bucket-existence probe rclone makes by default, and the
      # credential is scoped to one bucket anyway.
      RCLONE_CONFIG_BACKUP_NO_CHECK_BUCKET: "true"
    deploy:
      resources:
        limits:
          # A dump competes for CPU with the databases it is dumping. Half a core is enough
          # at this size and keeps a backup from being felt by users.
          cpus: "0.5"
          memory: 512M
        reservations:
          memory: 64M

  # =========================================================================
  # Authoring: routing and tiles (RF-3b, doc 07)
  #
  # Neither is on dokploy-network, so neither is reachable from the internet or from the v1
  # stack: Valhalla is consumed by `tours` over the internal network and by nothing else.
  # Both are behind profiles and run in staging only -- the dashboard is their only user, and
  # a re-import must not compete for CPU with user traffic (07 section 7).
  #
  #   docker compose --profile authoring up -d
  # =========================================================================
  valhalla:
    <<: *logging
    profiles: [authoring]
    # Pinned: the tile format has to match the binary that reads it, and `latest` silently
    # invalidates a build that takes half an hour.
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:3.5.1
    restart: unless-stopped
    networks: [internal]
    environment:
      # The regional OSM extract from Geofabrik. Changing it rebuilds the tiles on the next
      # start, which takes minutes to hours depending on the size.
      tile_urls: ${VALHALLA_TILE_URL}
      serve_tiles: "True"
      build_tar: "True"
      # Elevation multiplies disk and build time, and the tour profiles do not use it yet.
      build_elevation: "False"
      build_admins: "True"
      build_time_zones: "True"
      force_rebuild: "False"
    volumes:
      - valhalla-tiles:/custom_files
    deploy:
      resources:
        limits:
          # 07 section 3.2 budgets 2-4 GB for a regional extract. The ceiling is explicit so
          # a rebuild cannot take the VPS -- and the v1 stack on it -- down with it.
          cpus: "2.0"
          memory: 4G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8002/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      # The first start builds the tiles from the extract, measured in minutes. Until it
      # finishes the container is starting, not unhealthy.
      start_period: 30m

  # One-shot job, not a service: it produces a .pmtiles file and exits (07 section 4.2). Run
  # on demand, or monthly from the scheduler, never on every deployment.
  #
  #   docker compose --profile tiles run --rm planetiler
  #
  # The upload to R2 is a separate step, because that is where the bucket credentials live
  # and this container has no reason to hold them.
  planetiler:
    <<: *logging
    profiles: [tiles]
    image: ghcr.io/onthegomap/planetiler:0.9.0
    restart: "no"
    networks: [internal]
    command:
      - --download
      - --area=${PLANETILER_AREA}
      - --output=/data/tiles/${PLANETILER_AREA}.pmtiles
      - --force
    volumes:
      - valhalla-tiles:/data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
