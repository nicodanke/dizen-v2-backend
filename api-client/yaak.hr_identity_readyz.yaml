# Readiness probe. It answers 503 with the detail of which dependency is failing, which is
# the fastest way to tell a service that is down from one whose database is (RF-6).
yaak:
  schema: 3
  type: http_request
id: hr_identity_readyz
model: http_request
workspaceId: wk_dizen
folderId: fl_identity
name: Readiness
sortPriority: 4
method: GET
url: "${[ identity_http ]}/readyz"
headers:
  - name: Accept
    value: application/json
    enabled: true
