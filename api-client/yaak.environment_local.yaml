# Local environment, filled in and versioned.
#
# These are the ports deploy/docker-compose.yml publishes: constants of the development
# environment, the same on every machine. Committing them means the collection works right
# after `make up`, with nothing to type.
#
# The token variables stay empty here too: they are filled in by the sign-in request at run
# time (03 section 8.2, rule 4).
yaak:
  schema: 3
  type: environment
id: env_local
model: environment
workspaceId: wk_dizen
name: Local
base: false
variables:
  - name: identity_http
    value: "http://localhost:8081"
    enabled: true
  - name: identity_grpc
    value: "localhost:9091"
    enabled: true
  - name: tours_http
    value: "http://localhost:8082"
    enabled: true
  - name: tours_grpc
    value: "localhost:9092"
    enabled: true
  - name: booking_http
    value: "http://localhost:8083"
    enabled: true
  - name: booking_grpc
    value: "localhost:9093"
    enabled: true
  - name: admin_http
    value: "http://localhost:8084"
    enabled: true
  - name: admin_grpc
    value: "localhost:9094"
    enabled: true
  # The contract version the client declares. The server only rejects below
  # MIN_CLIENT_API_VERSION, which is unset locally, so this is informational until the first
  # api-v* tag exists.
  - name: api_version
    value: "1.0.0"
    enabled: true
  - name: access_token
    value: ""
    enabled: true
  - name: refresh_token
    value: ""
    enabled: true
