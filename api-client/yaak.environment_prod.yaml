# Production environment, versioned with empty values.
#
# Unlike `local`, these hostnames are not constants anybody can derive from the repository,
# and the tokens are real credentials. Each person fills in their own; nothing is marked
# sharable, which is what keeps a value from being synced into git.
yaak:
  schema: 3
  type: environment
id: env_prod
model: environment
workspaceId: wk_dizen
name: Production
base: false
variables:
  - name: identity_http
    value: ""
    enabled: true
  - name: identity_grpc
    value: ""
    enabled: true
  - name: tours_http
    value: ""
    enabled: true
  - name: tours_grpc
    value: ""
    enabled: true
  - name: booking_http
    value: ""
    enabled: true
  - name: booking_grpc
    value: ""
    enabled: true
  - name: admin_http
    value: ""
    enabled: true
  - name: admin_grpc
    value: ""
    enabled: true
  - name: api_version
    value: ""
    enabled: true
  - name: access_token
    value: ""
    enabled: true
  - name: refresh_token
    value: ""
    enabled: true
