# Liveness probe. It proves the process is up; it deliberately checks no dependency, because
# restarting never fixes a database that is down.
yaak:
  schema: 3
  type: http_request
id: hr_identity_livez
model: http_request
workspaceId: wk_dizen
folderId: fl_identity
name: Liveness
sortPriority: 3
method: GET
url: "${[ identity_http ]}/livez"
headers:
  - name: Accept
    value: application/json
    enabled: true
