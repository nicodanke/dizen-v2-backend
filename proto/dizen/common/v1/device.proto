syntax = "proto3";

package dizen.common.v1;

import "buf/validate/validate.proto";

// Platform of the device originating the call.
enum Platform {
  PLATFORM_UNSPECIFIED = 0;
  PLATFORM_IOS = 1;
  PLATFORM_ANDROID = 2;
  PLATFORM_WEB = 3;
}

// Device identification. It accompanies session creation and stays attached to the
// session so it can be revoked individually (02 section 1, sessions table).
message DeviceInfo {
  // Stable identifier generated by the app, unique per installation.
  string device_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];

  Platform platform = 2;

  // Hardware model, as reported by the operating system.
  string model = 3 [(buf.validate.field).string.max_len = 128];

  // App version, in semver format.
  string app_version = 4 [(buf.validate.field).string.max_len = 32];

  // Operating system version.
  string os_version = 5 [(buf.validate.field).string.max_len = 32];
}
